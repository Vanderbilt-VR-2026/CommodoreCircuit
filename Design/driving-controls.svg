<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9961A"/>
    </marker>
  </defs>

  <!-- Background (white so it reads on GitHub light and dark themes) -->
  <rect x="0" y="0" width="1100" height="470" rx="16" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1100" height="56" rx="16" fill="#141414"/>
  <rect x="0" y="40" width="1100" height="16" fill="#141414"/>
  <text x="550" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#FFC72C">How to Ride the Scooter</text>

  <!-- ============ Panel 1: Grab the handlebar ============ -->
  <rect x="20" y="76" width="330" height="374" rx="12" fill="#F7F5EF" stroke="#E2DccA"/>
  <circle cx="48" cy="104" r="16" fill="#FFC72C"/>
  <text x="48" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#141414">1</text>
  <text x="74" y="110" font-size="18" font-weight="700" fill="#141414">Grab the handlebar</text>
  <text x="185" y="140" text-anchor="middle" font-size="13" fill="#6B6B6B">Rider's view</text>

  <!-- level guide -->
  <line x1="45" y1="172" x2="325" y2="172" stroke="#27AE60" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="185" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#1E8449">level with the ground</text>

  <!-- stem + deck -->
  <rect x="179" y="205" width="12" height="120" rx="4" fill="#8A8A8A"/>
  <rect x="120" y="322" width="130" height="16" rx="8" fill="#AEEA00" stroke="#141414" stroke-width="2"/>
  <!-- bar -->
  <rect x="70" y="199" width="230" height="12" rx="6" fill="#8A8A8A"/>

  <!-- left controller lying horizontal -->
  <circle cx="66" cy="205" r="22" fill="none" stroke="#141414" stroke-width="7"/>
  <rect x="80" y="190" width="72" height="30" rx="15" fill="#141414"/>
  <rect x="98" y="217" width="34" height="9" rx="4" fill="#FFC72C" stroke="#141414" stroke-width="1.5"/>
  <text x="116" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">L</text>

  <!-- right controller lying horizontal -->
  <circle cx="304" cy="205" r="22" fill="none" stroke="#141414" stroke-width="7"/>
  <rect x="218" y="190" width="72" height="30" rx="15" fill="#141414"/>
  <rect x="238" y="217" width="34" height="9" rx="4" fill="#FFC72C" stroke="#141414" stroke-width="1.5"/>
  <text x="254" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R</text>

  <!-- grip callouts -->
  <line x1="115" y1="230" x2="115" y2="258" stroke="#C9961A" stroke-width="2" marker-start="url(#arrowGold)"/>
  <line x1="255" y1="230" x2="255" y2="258" stroke="#C9961A" stroke-width="2" marker-start="url(#arrowGold)"/>
  <text x="115" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#141414">grip</text>
  <text x="255" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#141414">grip</text>

  <text x="185" y="372" text-anchor="middle" font-size="14.5" fill="#141414">
    <tspan x="185" dy="0"><tspan font-weight="700">Hold the grip</tspan> (middle finger) on</tspan>
    <tspan x="185" dy="20">both hands to grab the bars.</tspan>
    <tspan x="185" dy="20">Hold the controllers <tspan font-weight="700">level</tspan>, like</tspan>
    <tspan x="185" dy="20">the handles of a real scooter.</tspan>
  </text>

  <!-- ============ Panel 2: Twist to steer ============ -->
  <rect x="365" y="76" width="330" height="374" rx="12" fill="#F7F5EF" stroke="#E2DccA"/>
  <circle cx="393" cy="104" r="16" fill="#FFC72C"/>
  <text x="393" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#141414">2</text>
  <text x="419" y="110" font-size="18" font-weight="700" fill="#141414">Twist to steer</text>
  <text x="530" y="140" text-anchor="middle" font-size="13" fill="#6B6B6B">Top-down view</text>

  <!-- forward indicator -->
  <line x1="660" y1="250" x2="660" y2="160" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="268" text-anchor="middle" font-size="12" fill="#6B6B6B">forward</text>

  <!-- straight bar (ghost) -->
  <line x1="430" y1="235" x2="630" y2="235" stroke="#BDBDBD" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>

  <!-- twisted bar: turning left -->
  <g transform="rotate(-20 530 235)">
    <line x1="430" y1="235" x2="630" y2="235" stroke="#8A8A8A" stroke-width="10" stroke-linecap="round"/>
    <rect x="420" y="222" width="54" height="26" rx="13" fill="#141414"/>
    <text x="447" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">L</text>
    <rect x="586" y="222" width="54" height="26" rx="13" fill="#141414"/>
    <text x="613" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">R</text>
  </g>
  <circle cx="530" cy="235" r="6" fill="#141414"/>

  <!-- hand motion arrows -->
  <path d="M 612 160 Q 640 185 628 212" fill="none" stroke="#141414" stroke-width="2.5" marker-start="url(#arrow)"/>
  <text x="590" y="156" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141414">push forward</text>
  <path d="M 448 310 Q 420 285 432 258" fill="none" stroke="#141414" stroke-width="2.5" marker-start="url(#arrow)"/>
  <text x="470" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141414">pull back</text>

  <text x="530" y="372" text-anchor="middle" font-size="14.5" fill="#141414">
    <tspan x="530" dy="0">Keep both grips held and <tspan font-weight="700">twist</tspan></tspan>
    <tspan x="530" dy="20">the bars like a real scooter.</tspan>
    <tspan x="530" dy="20">Right hand forward = <tspan font-weight="700">turn left</tspan>.</tspan>
    <tspan x="530" dy="20">Left hand forward = <tspan font-weight="700">turn right</tspan>.</tspan>
  </text>

  <!-- ============ Panel 3: Buttons ============ -->
  <rect x="710" y="76" width="370" height="374" rx="12" fill="#F7F5EF" stroke="#E2DccA"/>
  <circle cx="738" cy="104" r="16" fill="#FFC72C"/>
  <text x="738" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#141414">3</text>
  <text x="764" y="110" font-size="18" font-weight="700" fill="#141414">Go, brake, drift</text>

  <!-- Left controller -->
  <rect x="730" y="132" width="330" height="26" rx="6" fill="#141414"/>
  <text x="742" y="150" font-size="14" font-weight="700" fill="#FFC72C">LEFT CONTROLLER</text>
  <g font-size="14.5" fill="#141414">
    <rect x="732" y="168" width="96" height="24" rx="12" fill="#FFC72C"/>
    <text x="780" y="185" text-anchor="middle" font-weight="700">Trigger</text>
    <text x="840" y="185"><tspan font-weight="700">Go</tspan> (accelerate)</text>

    <rect x="732" y="200" width="96" height="24" rx="12" fill="#E2DccA"/>
    <text x="780" y="217" text-anchor="middle" font-weight="700">Grip</text>
    <text x="840" y="217">Hold the bars</text>

    <rect x="732" y="232" width="96" height="24" rx="12" fill="#E2DccA"/>
    <text x="780" y="249" text-anchor="middle" font-weight="700">Menu ☰</text>
    <text x="840" y="249">Pause</text>
  </g>

  <!-- Right controller -->
  <rect x="730" y="272" width="330" height="26" rx="6" fill="#141414"/>
  <text x="742" y="290" font-size="14" font-weight="700" fill="#FFC72C">RIGHT CONTROLLER</text>
  <g font-size="14.5" fill="#141414">
    <rect x="732" y="308" width="96" height="24" rx="12" fill="#FFC72C"/>
    <text x="780" y="325" text-anchor="middle" font-weight="700">Trigger</text>
    <text x="840" y="325"><tspan font-weight="700">Brake</tspan>, then reverse</text>

    <rect x="732" y="340" width="96" height="24" rx="12" fill="#E2DccA"/>
    <text x="780" y="357" text-anchor="middle" font-weight="700">Grip</text>
    <text x="840" y="357">Hold the bars</text>

    <rect x="732" y="372" width="96" height="24" rx="12" fill="#FFC72C"/>
    <text x="780" y="389" text-anchor="middle" font-weight="700">A</text>
    <text x="840" y="389"><tspan font-weight="700">Drift</tspan>: hold while turning,</text>
    <text x="840" y="407">let go for a boost</text>
  </g>
  <text x="895" y="436" text-anchor="middle" font-size="12.5" fill="#6B6B6B">Click either thumbstick to recenter the bars</text>
</svg>
